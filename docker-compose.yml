services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DBNAME}
    networks:
      - local
    volumes:
      - attendance_data:/var/lib/postgresql/data

networks:
  local:

volumes:
  attendance_data:
